project_id = "rmlczuhipndlvfvkpznm"

# Telefonen som videresender anbudsprotokollene har ingen Supabase-innlogging og
# sender verken apikey eller Authorization. Uten denne linja avviser gatewayen
# hver eneste melding med 401 så snart noen ruller ut funksjonen på nytt uten
# --no-verify-jwt. Tilgangen styres i stedet av sms_token, som er unik per firma.
[functions.sms-inn]
verify_jwt = false

# Her er det en databasetrigger som ringer, og den har ingen Supabase-
# innlogging. Tilgangen styres av x-varsel-nokkel, som må stemme med
# delt_hemmelighet i varsel_oppsett.
#
# NB: denne linja virker bare når supabase CLI gjør utrullingen. Funksjonen er
# rullet ut fra dashboardet, og der står JWT-sjekken på uansett hva som står
# her. Derfor sender triggeren i tillegg den offentlige anon-nøkkelen som
# Authorization — se 20260922000001_varsel_gjennom_gatewayen.sql. Skulle
# funksjonen en dag rulles ut med CLI-en, tar denne linja over, og
# Authorization-headeren blir uskadelig overflødig.
[functions.varsel-epost]
verify_jwt = false

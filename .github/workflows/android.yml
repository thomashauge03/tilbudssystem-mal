name: Bygg SMS-videresending (APK)

# Bygger appen i skyen, slik at APK-en kan lastes ned og installeres uten at
# noen trenger Android Studio lokalt.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  bygg:
    runs-on: ubuntu-latest
    # Trengs for å kunne legge ut APK-en som en utgivelse
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bygg debug-APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      # Debug-APK er signert med en standardnøkkel og kan installeres direkte.
      # Den kan ikke legges i Google Play, men det skal den heller ikke — appen
      # er til internt bruk på egne telefoner.
      - uses: actions/upload-artifact@v4
        with:
          name: sms-videresending-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Fast filnavn, slik at .../releases/latest/download/sms-videresending.apk
      # alltid peker på nyeste versjon. Det er lenken som skal åpnes på mobilen —
      # en artefakt krever innlogging og kommer som ZIP.
      - name: Gi APK-en et fast navn
        run: cp android/app/build/outputs/apk/debug/*.apk sms-videresending.apk

      - name: Legg ut som utgivelse
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sms-app
          name: SMS-videresending
          body: |
            Videresender anbudsprotokoller fra SMS til tilbudssystemet.

            Installer på Android, åpne appen, og lim inn adresse og nøkkel
            fra Innstillinger → Firma. Bygget fra commit ${{ github.sha }}.
          files: sms-videresending.apk
          make_latest: true
